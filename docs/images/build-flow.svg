<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CEF 104 Universal Framework 构建流程</title>
  <desc id="desc">初始化工具，选择 macOS 11 或 12，构建 arm64 和 x64，最后合并验证。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="1" stop-color="#eef8f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#506680"/>
    </marker>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .detail { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #506680; }
      .step { fill: #ffffff; stroke: #d5dfeb; stroke-width: 1.5; filter: url(#shadow); }
      .number { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="48" y="52" class="title">CEF 104 · 一个入口，两套版本，固定输出</text>

  <g transform="translate(48 105)">
    <rect class="step" width="230" height="170" rx="18"/>
    <circle cx="32" cy="32" r="18" fill="#4664e8"/><text x="32" y="37" text-anchor="middle" class="number">1</text>
    <text x="28" y="82" class="label">初始化</text>
    <text x="28" y="111" class="detail">./cef-build setup</text>
    <text x="28" y="137" class="detail">子仓 · LFS · 主机工具</text>
  </g>
  <path d="M288 190 H338" stroke="#506680" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(350 105)">
    <rect class="step" width="230" height="170" rx="18"/>
    <circle cx="32" cy="32" r="18" fill="#8a5adf"/><text x="32" y="37" text-anchor="middle" class="number">2</text>
    <text x="28" y="82" class="label">选择版本</text>
    <text x="28" y="111" class="detail">macos11 · 最低 11.0</text>
    <text x="28" y="137" class="detail">macos12 · 最低 12.0</text>
  </g>
  <path d="M590 190 H640" stroke="#506680" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(652 105)">
    <rect class="step" width="230" height="170" rx="18"/>
    <circle cx="32" cy="32" r="18" fill="#159a89"/><text x="32" y="37" text-anchor="middle" class="number">3</text>
    <text x="28" y="82" class="label">双架构构建</text>
    <text x="28" y="111" class="detail">arm64 → x64</text>
    <text x="28" y="137" class="detail">GN + Ninja · SDK 12.3</text>
  </g>
  <path d="M892 190 H942" stroke="#506680" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(954 105)">
    <rect class="step" width="198" height="170" rx="18" stroke="#82c7bc"/>
    <circle cx="32" cy="32" r="18" fill="#e47c3c"/><text x="32" y="37" text-anchor="middle" class="number">4</text>
    <text x="28" y="82" class="label">合并验证</text>
    <text x="28" y="111" class="detail">Universal Framework</text>
    <text x="28" y="137" class="detail">架构 · minOS · SHA256</text>
  </g>
  <text x="48" y="322" class="detail">输出：out/macos11/ 或 out/macos12/</text>
</svg>
